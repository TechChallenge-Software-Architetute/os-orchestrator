name: "os-orchestrator pipeline"

# Independent by design: this pipeline never reads another repository's Terraform
# state and never waits on another repository's deploy. Every input is either an
# explicit secret or a name derived from the branch.

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:

  # ---------------------------------------------------------------------------
  # Application checks
  # ---------------------------------------------------------------------------
  unit-test:
    name: "Unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
          cache: maven

      - name: Run tests
        run: ./mvnw -B test

  code-analysis:
    name: "Code analysis"
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
          cache: maven

      # Same shape as os-management's code-analysis job, with one fix: os-management
      # runs `verify -DskipTests`, which produces no jacoco.exec, so its report and
      # coverage gate are both silently skipped. Running `verify` without the flag
      # makes the report and the gate real. Costs a second test run; worth it over a
      # job that checks nothing.
      #
      # This still does NOT run a Sonar scan — os-management doesn't either, despite
      # having the plugin configured. See the pending item in HANDOFF.md.
      - name: Generate JaCoCo report and run coverage gate
        run: ./mvnw -B verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  build:
    name: "Build"
    runs-on: ubuntu-latest
    needs: code-analysis
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
          cache: maven

      - name: Package
        run: ./mvnw -B -DskipTests clean package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: os-orchestrator-jar
          path: target/*.jar

