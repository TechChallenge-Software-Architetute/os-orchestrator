  # ---------------------------------------------------------------------------
  # Terraform preflight (PR → develop, and pushes to develop)
  # ---------------------------------------------------------------------------
  preflight:
    name: "Terraform preflight"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    if: >
      (github.event_name == 'pull_request' &&
       github.event.pull_request.base.ref == 'develop') ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/develop')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform fmt & init (no backend)
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false

      - name: Terraform validate (placeholders)
        run: |
          cat > ci-placeholder.auto.tfvars <<EOF
          environment = "develop"
          EOF
          terraform validate

  # ---------------------------------------------------------------------------
  # Docker image
  # ---------------------------------------------------------------------------
  docker-build-push:
    name: "Docker build & push"
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: echo "image_tag=${{ github.ref_name }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          # Same secret name os-management uses, so the existing org-level
          # credential is reused instead of needing a second one.
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/os-orchestrator:${{ steps.tag.outputs.image_tag }}

  # ---------------------------------------------------------------------------
  # Terraform deploy — owns only this service's queue, DLQ and state table
  # ---------------------------------------------------------------------------
  terraform-deploy:
    name: "Terraform deploy"
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    defaults:
      run:
        working-directory: infra/terraform
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    env:
      TF_VAR_environment: ${{ github.ref_name }}
      TF_VAR_aws_account_id: ${{ github.ref_name == 'main' && secrets.AWS_ACCOUNT_ID_MAIN || secrets.AWS_ACCOUNT_ID_DEVELOP }}
      TF_STATE_BUCKET: ${{ github.ref_name == 'main' && secrets.TF_STATE_BUCKET_MAIN || secrets.TF_STATE_BUCKET_DEVELOP }}
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
      TF_VAR_region: ${{ secrets.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ github.ref_name == 'main' && secrets.AWS_ACCESS_KEY_ID_MAIN || secrets.AWS_ACCESS_KEY_ID_DEVELOP }}
          aws-secret-access-key: ${{ github.ref_name == 'main' && secrets.AWS_SECRET_ACCESS_KEY_MAIN || secrets.AWS_SECRET_ACCESS_KEY_DEVELOP }}
          # develop uses temporary (ASIA...) lab credentials, which require a session token.
          aws-session-token: ${{ github.ref_name != 'main' && secrets.AWS_SESSION_TOKEN_DEVELOP || '' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform init
        shell: bash
        run: |
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo "::error::TF_STATE_BUCKET_${{ github.ref_name == 'main' && 'MAIN' || 'DEVELOP' }} is not configured."
            exit 1
          fi

          terraform init \
            -input=false \
            -reconfigure \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=os-orchestrator/${{ github.ref_name }}/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"

      - name: Import existing AWS resources when state is empty
        shell: bash
        run: |
          import_if_missing() {
            local address="$1"
            local resource_id="$2"

            if ! terraform state show "$address" >/dev/null 2>&1; then
              terraform import -input=false "$address" "$resource_id"
            fi
          }

          env_name="${{ github.ref_name }}"

          for pair in \
            "aws_sqs_queue.order_processing_dlq:os-orchestrator-${env_name}-order-processing-dlq" \
            "aws_sqs_queue.order_processing:os-orchestrator-${env_name}-order-processing"
          do
            address="${pair%%:*}"
            queue_name="${pair#*:}"
            queue_url=$(aws sqs get-queue-url --queue-name "$queue_name" --query 'QueueUrl' --output text 2>/dev/null || true)
            if [ -n "$queue_url" ] && [ "$queue_url" != "None" ]; then
              import_if_missing "$address" "$queue_url"
            fi
          done

          table_name="os-orchestrator-${env_name}-order-state"
          table_exists=$(aws dynamodb describe-table --table-name "$table_name" \
            --query 'Table.TableName' --output text 2>/dev/null || true)
          if [ -n "$table_exists" ] && [ "$table_exists" != "None" ]; then
            import_if_missing "aws_dynamodb_table.order_state" "$table_name"
          fi

      - name: Terraform plan (save tfplan)
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infra/terraform/tfplan

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan

  # ---------------------------------------------------------------------------
  # EKS deploy — same cluster as os-management, own namespace
  # ---------------------------------------------------------------------------
  deploy-aws:
    name: "Deploy to EKS"
    runs-on: ubuntu-latest
    needs: [docker-build-push, terraform-deploy]
    environment: ${{ github.ref_name }}
    if: vars.USE_AWS == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
      CLUSTER_NAME: os-management-${{ github.ref_name }}
      IMAGE: ${{ secrets.DOCKER_USERNAME }}/os-orchestrator:${{ needs.docker-build-push.outputs.image_tag }}
      # Static keys because the cluster has no IRSA. See k8s/app-secret.yaml.tpl.
      # The pod reuses the pipeline's own AWS credentials (same lab role).
      APP_AWS_ACCESS_KEY_ID: ${{ github.ref_name == 'main' && secrets.AWS_ACCESS_KEY_ID_MAIN || secrets.AWS_ACCESS_KEY_ID_DEVELOP }}
      APP_AWS_SECRET_ACCESS_KEY: ${{ github.ref_name == 'main' && secrets.AWS_SECRET_ACCESS_KEY_MAIN || secrets.AWS_SECRET_ACCESS_KEY_DEVELOP }}
      APP_AWS_SESSION_TOKEN: ${{ github.ref_name != 'main' && secrets.AWS_SESSION_TOKEN_DEVELOP || '' }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate infrastructure inputs
        run: |
          test -n "${APP_AWS_ACCESS_KEY_ID}"     || { echo "::error::AWS_ACCESS_KEY_ID_${{ github.ref_name == 'main' && 'MAIN' || 'DEVELOP' }} is missing."; exit 1; }
          test -n "${APP_AWS_SECRET_ACCESS_KEY}" || { echo "::error::AWS_SECRET_ACCESS_KEY_${{ github.ref_name == 'main' && 'MAIN' || 'DEVELOP' }} is missing."; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ github.ref_name == 'main' && secrets.AWS_ACCESS_KEY_ID_MAIN || secrets.AWS_ACCESS_KEY_ID_DEVELOP }}
          aws-secret-access-key: ${{ github.ref_name == 'main' && secrets.AWS_SECRET_ACCESS_KEY_MAIN || secrets.AWS_SECRET_ACCESS_KEY_DEVELOP }}
          # develop uses temporary (ASIA...) lab credentials, which require a session token.
          aws-session-token: ${{ github.ref_name != 'main' && secrets.AWS_SESSION_TOKEN_DEVELOP || '' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl for the EKS cluster
        run: |
          aws eks update-kubeconfig --name "${CLUSTER_NAME}" --region "${AWS_REGION}"
          kubectl config current-context

      - name: Apply Kubernetes manifests
        run: |
          case "${{ github.ref_name }}" in
            main)    DD_ENV_TAG="production" ;;
            develop) DD_ENV_TAG="homolog" ;;
            *)       DD_ENV_TAG="developer" ;;
          esac

          # Names are derived from the branch, not from another repo's state.
          ORDER_PROCESSING_QUEUE="os-orchestrator-${{ github.ref_name }}-order-processing"
          ORDER_STATE_TABLE="os-orchestrator-${{ github.ref_name }}-order-state"

          kubectl apply -f k8s/namespace.yaml

          sed -e "s|\${aws_region}|${AWS_REGION}|g" \
              -e "s|\${order_processing_queue}|${ORDER_PROCESSING_QUEUE}|g" \
              -e "s|\${order_state_table}|${ORDER_STATE_TABLE}|g" \
              -e "s|\${datadog_env}|${DD_ENV_TAG}|g" \
              k8s/app-configmap.yaml.tpl | kubectl apply -f -

          # Temporary (ASIA...) keys need AWS_SESSION_TOKEN; drop the line when
          # there is none, since an empty token would make the SDK reject the keys.
          if [ -n "${APP_AWS_SESSION_TOKEN}" ]; then
            TOKEN_SED="s|\${aws_session_token}|${APP_AWS_SESSION_TOKEN}|g"
          else
            TOKEN_SED="/AWS_SESSION_TOKEN/d"
          fi

          sed -e "s|\${aws_access_key_id}|${APP_AWS_ACCESS_KEY_ID}|g" \
              -e "s|\${aws_secret_access_key}|${APP_AWS_SECRET_ACCESS_KEY}|g" \
              -e "${TOKEN_SED}" \
              -e "s|\${dd_api_key}|${DD_API_KEY}|g" \
              k8s/app-secret.yaml.tpl | kubectl apply -f -

          kubectl apply -f k8s/app.yaml

          kubectl patch deployment os-orchestrator -n os-orchestrator --type merge \
            -p "{\"spec\":{\"template\":{\"metadata\":{\"labels\":{\"tags.datadoghq.com/env\":\"${DD_ENV_TAG}\"}}}}}"

      - name: Update Deployment image
        run: |
          kubectl set image deployment/os-orchestrator os-orchestrator="${IMAGE}" -n os-orchestrator
          kubectl rollout status deployment/os-orchestrator -n os-orchestrator --timeout=300s || {
            echo "===== ROLLOUT FAILED — DIAGNOSTICS ====="
            kubectl get pods -n os-orchestrator -o wide
            kubectl describe pod -n os-orchestrator -l app=os-orchestrator
            kubectl logs -n os-orchestrator -l app=os-orchestrator --tail=120 --all-containers=true || true
            kubectl get events -n os-orchestrator --sort-by=.lastTimestamp | tail -40
            exit 1
          }
