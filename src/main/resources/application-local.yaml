# Local development against LocalStack (docker-compose.yml + init-aws.sh).
#
# Activate explicitly:  SPRING_PROFILES_ACTIVE=local ./mvnw spring-boot:run
#
# This is opt-in rather than the default so that a missing environment variable in
# a real deployment fails fast instead of quietly pointing the app at localhost
# with throwaway credentials.
spring:
  cloud:
    aws:
      endpoint: http://localhost:4566
      region:
        static: us-east-1
      credentials:
        # Dummy values accepted by LocalStack. They are not real credentials and
        # only ever apply under this profile.
        access-key: test
        secret-key: test

app:
  aws:
    region: us-east-1
    sqs:
      order-processing-queue: order-processing-queue
    dynamodb:
      order-state-table: order-state
      endpoint: http://localhost:4566
